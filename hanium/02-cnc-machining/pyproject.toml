[project]
name = "cnc-preprocessing"
version = "0.1.0"
description = "CNC machining anomaly detection: preprocessing, LSTM autoencoder, MLflow tracking, FastAPI serving, RAG action guide"
authors = [
    { name = "jwoh", email = "ojeongu63@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.9.0",
    "fastapi>=0.140.7",
    "matplotlib>=3.11.1",
    "mlflow>=3.14",
    "numpy>=2.5.1",
    "openai>=1.50.0",
    "pandas<3",  # mlflow 3.x requires pandas<3
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "uvicorn>=0.51.0",
]

[tool.uv.build-backend]
module-name = "preprocessing"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
